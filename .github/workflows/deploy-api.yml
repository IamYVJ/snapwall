name: Deploy API

on:
  push:
    branches: [main]
    paths: ['api/**', 'shared/**', 'package-lock.json', '.github/workflows/deploy-api.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check -w api
      - run: npx wrangler d1 migrations apply snapwall --remote
        working-directory: api
      - run: npx wrangler deploy
        working-directory: api
