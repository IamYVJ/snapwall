name = "snapwall-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# Origins allowed to call the API (comma-separated). Your GitHub Pages origin, no path.
ALLOWED_ORIGINS = "https://iamyvj.github.io"
# Where the web app is served, with trailing slash. Used for sign-in redirects.
WEB_BASE_URL = "https://iamyvj.github.io/snapwall/"

# Secrets (set with `npx wrangler secret put <NAME>`):
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, TOKEN_KEY, SIGNING_KEY

[[d1_databases]]
binding = "DB"
database_name = "snapwall"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[triggers]
crons = ["17 3 * * *"]

[observability]
enabled = true
